name: .NET Tests

on:
  workflow_call:
    inputs:
      runs-on:
        required: true
        type: string
      dotnet-version:
        required: true
        type: string

jobs:
  test:
    runs-on: ${{ inputs.runs-on }}
    env:
      # Tests only need the matching target framework; the slnf also builds the Web project, which needs node
      TestFramework: net${{ inputs.dotnet-version == '8.0.x' && '8.0' || '10.0' }}

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ inputs.dotnet-version }}

    - name: Create global.json to enforce .NET 8 for MSBuild and update Tests/TestData projects
      if: inputs.dotnet-version == '8.0.x'
      shell: pwsh
      run: ./.github/scripts/update-testdata-targetframework.ps1

    - name: Log .NET version
      run: dotnet --info

    - name: Build
      run: dotnet build Tests/Tests.csproj -c Release -f ${{ env.TestFramework }}

    - name: Execute unit tests
      run: dotnet test Tests/Tests.csproj -c Release -f ${{ env.TestFramework }} --no-build
